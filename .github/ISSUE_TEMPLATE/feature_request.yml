name: Feature request
description: A Live capability, tool, or workflow the server does not cover yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The production task that is not expressible today
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Proposed tool, argument, or resource change
    validations:
      required: true

  - type: textarea
    id: live-api
    attributes:
      label: Live API evidence
      description: The Live Object Model property or method this needs, and the Live version you checked
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This changes an existing tool contract
        - label: This adds a mutation of the Live Set
