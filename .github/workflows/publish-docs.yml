name: Publish release documentation

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          expected="$(node -p 'require("./package.json").version')"
          if [[ ! "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not resolve package.json version"
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$expected" ]]; then
            echo "::error::Expected release tag v$expected (package.json version), got $RELEASE_TAG"
            exit 1
          fi
          commit="$GITHUB_SHA"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$tag_commit" != "$commit" ]]; then
            echo "::error::Release tag does not resolve to the checked-out commit"
            exit 1
          fi
          epoch="$(git show -s --format=%ct "$commit")"
          if [[ ! "$commit" =~ ^[a-f0-9]{40}$ || ! "$epoch" =~ ^[0-9]+$ ]]; then
            echo "::error::Release identity does not resolve to immutable provenance"
            exit 1
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            echo "commit=$commit"
            echo "epoch=$epoch"
          } >> "$GITHUB_OUTPUT"

      - name: Test product and release documentation
        run: |
          brew install imagemagick ffmpeg
          npm ci
          npm test

      - name: Build and verify release artifact
        id: artifact
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          EPOCH: ${{ steps.release.outputs.epoch }}
        run: |
          node scripts/docs/build.mjs --version "$VERSION" --tag "$TAG" --commit "$COMMIT" --source-date-epoch "$EPOCH"
          node scripts/docs/verify.mjs --version "$VERSION" --tag "$TAG" --commit "$COMMIT" --source-date-epoch "$EPOCH"
          output="$RUNNER_TEMP/ableton-mcp-docs-release"
          envelope="$RUNNER_TEMP/cavi-oss-release.json"
          node scripts/docs/release-artifact.mjs --docs-root "docs/ableton-mcp/v${VERSION}" --output "$output" --version "$VERSION" --tag "$TAG" --repository "$GITHUB_REPOSITORY" --commit "$COMMIT" --source-date-epoch "$EPOCH" > "$envelope"
          artifact="ableton-mcp-docs-${TAG}.tar.gz"
          sha256="$(jq -r '.artifact.sha256' "$envelope")"
          {
            echo "directory=$output"
            echo "name=$artifact"
            echo "sha256=$sha256"
            echo "envelope=$envelope"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          DIRECTORY: ${{ steps.artifact.outputs.directory }}
          ARTIFACT: ${{ steps.artifact.outputs.name }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          existing="$RUNNER_TEMP/existing-$ARTIFACT"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT" --output "$existing" 2>/dev/null; then
            existing_sha="$(shasum -a 256 "$existing" | cut -d' ' -f1)"
            if [[ "$existing_sha" != "$SHA256" ]]; then
              echo "::error::Existing release asset differs; refusing overwrite"
              exit 1
            fi
            echo "Identical release asset already exists"
            existing_checksum="$RUNNER_TEMP/existing-$ARTIFACT.sha256"
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT.sha256" --output "$existing_checksum" 2>/dev/null; then
              expected_checksum="$SHA256  $ARTIFACT"
              actual_checksum="$(sed -n '1p' "$existing_checksum")"
              if [[ "$actual_checksum" != "$expected_checksum" ]]; then
                echo "::error::Existing release checksum differs; refusing overwrite"
                exit 1
              fi
            else
              gh release upload "$TAG" "$DIRECTORY/$ARTIFACT.sha256" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release upload "$TAG" "$DIRECTORY/$ARTIFACT" "$DIRECTORY/$ARTIFACT.sha256" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Dispatch verified release to cavi-home
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          ENVELOPE: ${{ steps.artifact.outputs.envelope }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::CONSUMER_DISPATCH_TOKEN is required"
            exit 1
          fi
          jq -n --argjson payload "$(cat "$ENVELOPE")" \
            '{event_type:"cavi-oss-release",client_payload:$payload}' | \
            gh api --method POST /repos/cavi-ai/cavi-home/dispatches --input -
