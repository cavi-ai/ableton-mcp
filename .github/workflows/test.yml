name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  merged-pr:
    # A main push from a merged pull request skips the suite that pull request already passed.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tested: ${{ steps.pr.outputs.tested }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)] | length' || echo 0)
          if [ "$merged" -gt 0 ]; then echo "tested=true" >> "$GITHUB_OUTPUT"; fi

  test:
    needs: [merged-pr]
    if: ${{ !failure() && !cancelled() && needs.merged-pr.outputs.tested != 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: brew install imagemagick ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run eval:core
      - run: npm run verify:package
